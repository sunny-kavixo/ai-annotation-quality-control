name: Annotation QC product CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m pytest -q

      - name: Smoke test clean dataset
        run: python run_qc.py data/sample_annotations.csv

      - name: Verify messy dataset fails QC as expected
        shell: bash
        run: |
          if python run_qc.py data/messy_annotations.csv --output /tmp/messy_report.json; then
            echo "Expected messy dataset to fail QC, but it passed."
            exit 1
          fi
          test -s /tmp/messy_report.json

      - name: Verify dashboard source compiles
        run: python -m py_compile dashboard.py

      - name: Smoke test dashboard server
        shell: bash
        run: |
          streamlit run dashboard.py --server.headless=true --server.port=8501 >/tmp/streamlit.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://localhost:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1

      - name: Verify Docker build
        run: docker build -t annotation-qc:test .
