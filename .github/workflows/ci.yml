name: Annotation QC product CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m pytest -q

      - name: Smoke test clean dataset
        run: python run_qc.py data/sample_annotations.csv

      - name: Verify messy dataset fails QC as expected
        shell: bash
        run: |
          if python run_qc.py data/messy_annotations.csv --output /tmp/messy_report.json; then
            echo "Expected messy dataset to fail QC, but it passed."
            exit 1
          fi
          test -s /tmp/messy_report.json

      - name: Verify dashboard imports
        run: python -c "import dashboard"

      - name: Verify Docker build
        run: docker build -t annotation-qc:test .
